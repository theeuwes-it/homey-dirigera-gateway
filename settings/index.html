<!DOCTYPE html>
<html>
  <head>
    <script src="/homey.js" data-origin="settings"></script>
    <style>
      .hub-field-action {
        margin-top: 8px;
      }

      .hub-field-action > button {
        position: static;
      }

      #pairingPrompt {
        margin: 12px 0;
        padding: 14px;
        border: 1px solid #b45309;
        border-radius: 8px;
        background: #fed7aa;
        color: #431407;
        font-size: 1.125rem;
        font-weight: 700;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <header class="homey-header">
      <h1 class="homey-title" data-i18n="settings.title"></h1>
      <p class="homey-subtitle" data-i18n="settings.subtitle"></p>
    </header>

    <fieldset class="homey-form-fieldset" id="hubSettings">
      <legend class="homey-form-legend" data-i18n="settings.legend_gateway_settings"></legend>
      <div class="homey-form-group">
        <label class="homey-form-label" for="hub" data-i18n="settings.field_hub"></label>
        <select class="homey-form-select" id="hub"></select>
      </div>
      <div class="homey-form-group">
        <label class="homey-form-label" for="hubName" data-i18n="settings.field_hub_name"></label>
        <input class="homey-form-input" id="hubName" type="text" />
        <div class="hub-field-action" id="saveNameAction" hidden>
          <button type="button" id="saveName" class="homey-button-secondary" data-i18n="settings.button_save_name"></button>
        </div>
      </div>
      <div class="homey-form-group">
        <label class="homey-form-label" for="ipAddress" data-i18n="settings.field_ip_address"></label>
        <input class="homey-form-input" id="ipAddress" type="text" />
        <div class="hub-field-action">
          <button type="button" id="discover" class="homey-button-secondary" data-i18n="settings.button_discover"></button>
        </div>
      </div>
      <button type="button" id="authenticate" class="homey-button-primary-full"></button>
      <div class="hub-field-action" id="removeAction" hidden>
        <button type="button" id="remove" class="homey-button-secondary" data-i18n="settings.button_remove"></button>
      </div>
      <p id="pairingPrompt" role="alert" hidden></p>
      <p id="status" role="status"></p>
    </fieldset>

    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" data-i18n="settings.legend_debugging"></legend>
      <div class="homey-form-group">
        <label class="homey-form-label" for="debugLogging" data-i18n="settings.field_debugging"></label>
        <input class="homey-form-input" id="debugLogging" type="checkbox" />
      </div>
    </fieldset>

    <script>
      function onHomeyReady(Homey) {
        const get = id => document.getElementById(id);
        const settings = get('hubSettings');
        const select = get('hub');
        const name = get('hubName');
        const ip = get('ipAddress');
        const status = get('status');
        const pairingPrompt = get('pairingPrompt');
        const authenticate = get('authenticate');
        const remove = get('remove');
        const debug = get('debugLogging');
        let hubs = [];

        function api(method, path, body = null) {
          return new Promise((resolve, reject) => {
            Homey.api(method, path, body, (err, data) => err ? reject(err) : resolve(data));
          });
        }

        function selectHub() {
          const hub = hubs.find(entry => entry.id === select.value);
          name.value = hub ? hub.name : '';
          ip.value = hub ? hub.ipAddress : '';
          authenticate.textContent = Homey.__(hub ? 'settings.button_restart_authentication' : 'settings.button_authenticate');
          get('removeAction').hidden = !hub;
          get('saveNameAction').hidden = !hub;
          status.textContent = '';
        }

        function showHubs(newHubs, selectedId) {
          if (!Array.isArray(newHubs)) throw new Error(Homey.__('settings.hub_list_unavailable'));
          hubs = newHubs;
          select.replaceChildren(new Option(Homey.__('settings.add_hub'), ''));
          for (const hub of hubs) select.add(new Option(hub.name + ' (' + hub.ipAddress + ')', hub.id));
          select.value = selectedId || '';
          selectHub();
        }

        async function run(action) {
          settings.disabled = true;
          status.textContent = '';
          try {
            await action();
          } catch (err) {
            status.textContent = err.message || String(err);
          } finally {
            settings.disabled = false;
          }
        }

        select.addEventListener('change', selectHub);
        get('discover').addEventListener('click', () => run(async () => {
          const result = await api('GET', '/');
          if (!result || !result.data) throw new Error(Homey.__('settings.discover_not_found'));
          ip.value = result.data;
        }));
        authenticate.addEventListener('click', () => run(async () => {
          const ipAddress = ip.value.trim();
          const session = await api('POST', '/', {
            hub_id: select.value || null,
            name: name.value,
            ip_address: ipAddress,
          });
          if (!session?.sessionId) throw new Error(Homey.__('settings.authentication_unconfirmed'));

          pairingPrompt.textContent = Homey.__('settings.press_action_button');
          pairingPrompt.hidden = false;
          try {
            const deadline = Date.now() + 60000;
            while (Date.now() < deadline) {
              const result = await api('POST', '/getAccessToken', { session_id: session.sessionId });
              if (result?.hubId && Array.isArray(result.hubs)) {
                showHubs(result.hubs, result.hubId);
                status.textContent = Homey.__('settings.title_authenticated');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            throw new Error(Homey.__('settings.authentication_unconfirmed'));
          } finally {
            pairingPrompt.hidden = true;
          }
        }));
        get('saveName').addEventListener('click', () => run(async () => {
          const selectedId = select.value;
          const newHubs = await api('POST', '/renameHub', { hub_id: selectedId, name: name.value });
          showHubs(newHubs, selectedId);
          status.textContent = Homey.__('settings.name_saved');
        }));
        remove.addEventListener('click', () => {
          Homey.confirm(Homey.__('settings.confirm_remove'), (err, confirmed) => {
            if (err) return Homey.alert(err);
            if (confirmed) run(async () => {
              showHubs(await api('POST', '/removeHub', { hub_id: select.value }));
            });
          });
        });
        Homey.get('debugLogging', (err, enabled) => {
          if (err) return Homey.alert(err);
          debug.checked = Boolean(enabled);
        });
        debug.addEventListener('change', () => {
          api('POST', '/setdebugging', { debug_logging: debug.checked }).catch(err => Homey.alert(err));
        });
        Homey.ready();
        run(async () => {
          const saved = await api('GET', '/hubs');
          showHubs(saved, saved?.[0]?.id);
        });
      }
    </script>
  </body>
</html>
